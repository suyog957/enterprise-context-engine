[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-context-agent"
version = "0.2.0"
description = "Local-first enterprise context graph and policy-grounded agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.0.10,<2.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "opentelemetry-instrumentation-psycopg>=0.51b0",
  "opentelemetry-sdk>=1.30,<2.0",
  "owlrl>=7.1,<8.0",
  "pydantic-settings>=2.7,<3.0",
  "pyshacl>=0.30,<1.0",
  "python-json-logger>=3.2,<4.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "prometheus-client>=0.21,<1.0",
  "rapidfuzz>=3.11,<4.0",
  "rdflib>=7.1,<8.0",
  # Explicit floor: Starlette < 1.3.1 has published request-handling advisories.
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1,<8.0",
  "pip-audit>=2.7,<3.0",
  "ruff>=0.9,<1.0",
]
embeddings = ["sentence-transformers>=3.3,<6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
  "integration: requires external service dependencies (isolated test databases)",
  "e2e: requires the full running stack; run with -m e2e",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["owlrl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
