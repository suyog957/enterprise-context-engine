[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-context-agent"
version = "0.1.0"
description = "Local-first enterprise context graph and policy-grounded agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2.60,<1.0",
  "owlrl>=7.1,<8.0",
  "pydantic-settings>=2.7,<3.0",
  "pyshacl>=0.30,<1.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
  "rapidfuzz>=3.11,<4.0",
  "rdflib>=7.1,<8.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]
embeddings = ["sentence-transformers>=3.3,<6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires external service dependencies"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["owlrl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
