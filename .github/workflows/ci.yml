name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly full-stack evaluation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  OPA_IMAGE: openpolicyagent/opa:1.0.0

jobs:
  # 1. Static checks, unit tests, policy tests and the offline evaluation gates.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src apps/api scripts tests
      - name: Mypy (strict)
        run: mypy src apps/api scripts tests
      - name: Unit and evaluation-gate tests
        run: pytest -m "not integration and not e2e" --cov=enterprise_context --cov-report=term
      - name: OPA policy tests
        run: docker run --rm -v "$PWD/policies:/policies:ro" "$OPA_IMAGE" test /policies -v
      - name: Generate synthetic data and golden sets
        run: |
          python scripts/generate_synthetic_data.py
          python scripts/resolve_entities.py
      - name: Offline evaluation smoke (critical gates fail the build)
        run: python scripts/run_evaluation.py --suite smoke --fail-on-regression
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable --progress-spinner off

  # 2. Integration tests against real service containers (isolated test datasets).
  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ecg_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      fuseki:
        image: stain/jena-fuseki:5.1.0
        env:
          ADMIN_PASSWORD: ci_only_password
          FUSEKI_DATASET_1: enterprise_test
        ports: ["3030:3030"]
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecg_test
      TEST_FUSEKI_URL: http://localhost:3030/enterprise_test
      FUSEKI_ADMIN_PASSWORD: ci_only_password
      OPENSEARCH_URL: http://localhost:9200
      OPA_URL: http://localhost:8181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.2" && python -m pip install -e ".[dev]"
      - name: Start OPA with the policy bundle
        run: |
          docker run -d --name opa -p 8181:8181 -v "$PWD/policies:/policies:ro" \
            "$OPA_IMAGE" run --server --addr=0.0.0.0:8181 /policies
      - name: Wait for services
        run: |
          for url in http://localhost:9200 http://localhost:8181/health 'http://localhost:3030/$/ping'; do
            for _ in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 2; done
          done
      - name: Integration tests
        run: pytest -m integration -v

  # 3. Full stack: compose up, data pipeline, end-to-end tests and the full evaluation.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          for _ in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8000/health/ready && break; sleep 2; done
      - name: Data pipeline
        run: |
          T="docker compose --profile tools run --rm -T tools"
          $T python scripts/migrate.py
          $T python scripts/generate_synthetic_data.py
          $T python scripts/resolve_entities.py
          $T python scripts/ingest_data.py
          $T python scripts/build_graph.py --upload
          $T python scripts/build_search_index.py
      - name: End-to-end tests
        run: docker compose --profile tools run --rm -T -e E2E_API_URL=http://api:8000 tools pytest -m e2e -v
      - name: Browser smoke tests (Playwright, desktop and mobile)
        run: |
          docker run --rm --network ontology_default -v "$PWD/apps/web":/src:ro             -e WEB_BASE_URL=http://web -e CI=1 mcr.microsoft.com/playwright:v1.63.0-noble sh -c             'mkdir -p /tmp/w && cp -r /src/package.json /src/package-lock.json /src/playwright.config.ts /src/e2e /tmp/w/ && cd /tmp/w && npm ci --ignore-scripts && npx playwright test'
      - name: Full evaluation (critical gates fail the build)
        run: docker compose --profile tools run --rm -T tools python scripts/run_evaluation.py --suite full --fail-on-regression
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: data/evaluation/generated/
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # 4. Web build and browser smoke tests.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Component and client tests (Vitest)
        run: npm test
        working-directory: apps/web
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
        working-directory: apps/web

  # 5. Container image vulnerability scan (open-source Trivy).
  image-scan:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile --target runtime -t enterprise-context-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-context-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
