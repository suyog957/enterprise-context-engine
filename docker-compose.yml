services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_context}
      POSTGRES_USER: ${POSTGRES_USER:-context_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  fuseki:
    image: stain/jena-fuseki:5.1.0
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-local_dev_only_change_me}
      FUSEKI_DATASET_1: enterprise
      # Isolated dataset for integration tests; never used by the application.
      FUSEKI_DATASET_2: enterprise_test
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki_data:/fuseki

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  opa:
    image: openpolicyagent/opa:1.0.0
    restart: unless-stopped
    command: ["run", "--server", "--watch", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-context_app}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-enterprise_context}
      FUSEKI_URL: http://fuseki:3030/enterprise
      OPENSEARCH_URL: http://opensearch:9200
      OPA_URL: http://opa:8181
      DATA_DIR: /app/data
      ENVIRONMENT: local
      DRY_RUN: ${DRY_RUN:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JAEGER_QUERY_URL: http://jaeger:16686
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s

  # Applies committed outbox events (e.g. new purchase orders) to the RDF projection.
  projector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["python", "-m", "enterprise_context.projection.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-context_app}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-enterprise_context}
      FUSEKI_URL: http://fuseki:3030/enterprise
      FUSEKI_ADMIN_USER: ${FUSEKI_ADMIN_USER:-admin}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-local_dev_only_change_me}
      ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # Developer tooling: `docker compose --profile tools run --rm tools <command>`.
  # Runs scripts, lint, type checks and tests with the repository bind-mounted,
  # so no host Python installation is required.
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
      args:
        INSTALL_EMBEDDINGS: ${INSTALL_EMBEDDINGS:-false}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-context_app}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-enterprise_context}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      TEST_FUSEKI_URL: http://fuseki:3030/enterprise_test
      FUSEKI_URL: http://fuseki:3030/enterprise
      FUSEKI_ADMIN_USER: ${FUSEKI_ADMIN_USER:-admin}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-local_dev_only_change_me}
      OPENSEARCH_URL: http://opensearch:9200
      OPA_URL: http://opa:8181
      API_URL: http://api:8000
      DATA_DIR: /work/data
      ONTOLOGY_DIR: /work/ontology
      MIGRATIONS_DIR: /work/infra/sql
      ENVIRONMENT: local
      HF_HOME: /work/.cache/huggingface
    volumes:
      - .:/work
    working_dir: /work

volumes:
  postgres_data:
  fuseki_data:
  opensearch_data:
  prometheus_data:
